<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:dark;
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--text:#eef0f4;--mut:#8b93a3;

  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{padding:calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 120px);max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
button:active{opacity:.7}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
h1{font-size:26px;margin:4px 0}
h2{font-size:18px;margin:18px 0 8px}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.top .r{display:flex;gap:6px;align-items:center}
.gear{font-size:34px;line-height:1;padding:0 8px;min-width:50px;min-height:50px;display:flex;align-items:center;justify-content:center}
.wfoot{display:flex;gap:8px;margin-top:16px}
.wfoot button{flex:1;padding:14px;font-size:17px}
.wfoot .pri{flex:1.4}
.wfoot .danger{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.warncard{background:var(--card);border:1px solid var(--warn);border-radius:14px;padding:12px;margin:10px 0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;-webkit-user-select:all;user-select:all;background:var(--bg);border-radius:8px;padding:8px;margin-top:8px;font-size:14px}
.mut{color:var(--mut)}
.small{font-size:13px}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.pri{background:var(--acc);color:#fff;font-weight:600}
.big{width:100%;padding:14px;font-size:17px}
.tmpl{display:flex;align-items:center;gap:8px}
.tmpl .go{flex:1;text-align:left;background:var(--card);padding:14px}
.tmpl .go b{display:block;font-size:18px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0}
.tog{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;padding:0;flex:none}

.tog.on{background:var(--good)}
.tog.on::after{left:25px}
.whead{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 6px) 0 6px;margin-top:calc(-1 * var(--safe-t) - 8px)}
.exh{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.exname{background:none;padding:0;text-align:left;font-weight:700;font-size:17px}
.chips{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.chip.wt{background:#1d2c44;color:#9cc6ff}
.last{font-size:13px;color:var(--mut);margin:6px 0 4px}

.swapnote{background:#3a2e12;color:#f5d28a;border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}

.set .sn{color:var(--mut);font-size:14px;text-align:center}
.stp{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.stp .u{font-size:11px;color:var(--mut);margin-left:-4px;margin-right:2px}
.chk{height:44px;width:48px;border-radius:10px;font-size:20px;background:var(--card2);color:var(--mut)}
.set.done .chk{background:var(--good);color:#06210f}
.set.done .stp{background:var(--done);border-color:#24503a}
.cmp{grid-column:2/-1;font-size:12px;color:var(--mut);margin-top:-2px}

.rowbtns{display:flex;gap:6px;margin-top:8px}

#timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#11151d;border-top:1px solid var(--line);padding:10px 12px calc(var(--safe-b) + 10px)}

#timer .t{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}

#sheet .pane{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 14px calc(var(--safe-b) + 16px);max-height:85vh;overflow:auto}
#sheet .pane h3{margin:0 0 10px}
.list button{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card2)}
.list .k{float:right;font-size:12px;color:var(--mut);margin-top:3px}
.hist .s{padding:10px 0;border-top:1px solid var(--line)}
.hist .s:first-child{border-top:0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:12px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:15px}
.danger{color:var(--bad)}
.sess{cursor:pointer}
.sess .d{display:flex;justify-content:space-between}
.sess .ex{font-size:14px;color:var(--mut);margin-top:4px}
.sess .detail{margin-top:8px;font-size:14px}
.sess .detail div{padding:3px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 6px 1px 2px;vertical-align:middle}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;background:none;padding:9px 6px;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--text);font-weight:600}
.seg.sm{background:var(--bg);margin:8px 0}
.seg.sm:empty{display:none}
.seg.sm button{font-size:14px;padding:7px 4px}
.calh{display:flex;align-items:center;justify-content:space-between;text-align:center;margin-bottom:10px}
.calh button{width:44px;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:12px;color:var(--mut);padding-bottom:2px}
.cd{aspect-ratio:1;padding:0;font-size:15px;background:var(--bg);border-radius:9px;position:relative;color:var(--mut)}
.cd:disabled{opacity:1;cursor:default}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--mut)}
.cd.sel{box-shadow:0 0 0 2px var(--text)}
.cd i{position:absolute;top:1px;right:4px;font-style:normal;font-size:11px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:70px;margin-top:10px;align-items:end}
.weeks div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.weeks span{width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.weeks em{font-style:normal;font-size:11px;color:var(--mut);position:absolute;bottom:-16px}
.weeks{margin-bottom:16px}
select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.readout{margin:4px 0 2px;font-size:18px}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:10px}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linejoin:round}
.chart .area{fill:var(--acc);opacity:.12}
.chart .pt{fill:var(--acc)}
.chart .pt.sel{fill:var(--text);stroke:var(--acc);stroke-width:2.5}
.restchip em{font-style:normal;color:var(--warn);font-size:11px;margin-left:2px}
.pwrap{position:relative;margin:10px 0 14px}
.picker{height:176px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(#0000,#000 28%,#000 72%,#0000);mask-image:linear-gradient(#0000,#000 28%,#000 72%,#0000)}
.picker::-webkit-scrollbar{display:none}
.plist{padding:66px 0}
.pitem{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mut);transition:color .12s,font-size .12s}
.pitem.sel{color:var(--text);font-size:32px;font-weight:700}
.pband{position:absolute;left:0;right:0;top:66px;height:44px;pointer-events:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#timer .tadj{width:54px;flex:none;padding:10px 0;font-size:13px;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums}
</style>

<body>
<div id="app"></div>
<div id="timer" hidden></div>
<div id="sheet" hidden></div>
<input type="file" id="file" accept=".csv,text/csv" hidden>
<script>
"use strict";
const KEY = 'liftlog.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const clean = n => String(n || '').trim().replace(/\s+/g, ' ');
const ALIAS = { 'pullups':'Pull Ups', 'pull ups':'Pull Ups', 'pull-ups':'Pull Ups', 'weighted pull ups':'Pull Ups', 'trx face pull':'TRX Face Pull' };
const canon = n => ALIAS[clean(n).toLowerCase()] || clean(n);
const key = n => canon(n).toLowerCase();
const fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtD = t => new Date(t).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

// ---------- defaults (from Nadav's Easy Reps templates) ----------
const T = (name, ex) => ({ id: uid(), name, ex: ex.map(([n, sets, bw]) => ({ name: n, sets, bw: !!bw })) });
const DEFAULTS = () => ({
  settings: { rest: 120, travel: false, restByEx: {}, subs: {}, unit: 'lb' },
  kinds: { 'ring dips':'addon', 'pull ups':'addon', 'ring push ups':'addon',
           'standing dumbbell press':'load', 'dumbbell bicep curl':'load' },
  templates: [
    T('Push', [['Ring Dips',2],['Pike Push Ups',2],['Standing Dumbbell Press',2],['Ring push ups',2,1],['TRX scull crusher tricep extension superset',2]]),
    T('Pull', [['Pull Ups',2],['Ring row',2],['Dumbbell Bicep Curl',2],['TRX Y',2],['Pelican curl',2],['TRX hammer',2]]),
  ],
  sessions: [], active: null, timer: null, imported: false, codeAck: false,
});

// ---------- storage ----------
let db, memStore = null;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = memStore; }
  try { db = raw ? JSON.parse(raw) : DEFAULTS(); } catch (e) { db = DEFAULTS(); }
  const d = DEFAULTS();
  for (const k in d) if (db[k] === undefined) db[k] = d[k];
  for (const k in d.settings) if (db.settings[k] === undefined) db.settings[k] = d.settings[k];
  if (!db.dropBwTemplates) { db.templates = db.templates.filter(t => !/^(push|pull) - bodyweight$/i.test(t.name)); db.dropBwTemplates = true; }
}
function save() {
  const s = JSON.stringify(db);
  try { localStorage.setItem(KEY, s); } catch (e) { memStore = s; }
  queuePush();
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// ---------- cloud backup ----------
// Off-device backup so a lost phone doesn't take the history with it.
// The anon key below is public by design and grants nothing on its own: the
// backups table denies it outright, and the only way in is two functions that
// both demand the sync code. The code is the real secret -- it is generated on
// this device, never leaves it except to talk to the backup, and is shown in
// Settings so it can be written down. Lose it and the backup is unreachable.
const SB_URL = 'https://eojdoxilyvlwamjbqlrv.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvamRveGlseXZsd2FtamJxbHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwNTQwMzgsImV4cCI6MjA4MjYzMDAzOH0.r_3kTqa8DufglUk3O9nxbeKWGAJG3ojVD6T4leN03rY';
const CODE_KEY = 'liftlog.sync';
// Set once this device is known to hold the RIGHT code -- either it pulled a
// backup down with it, or it pushed real history up with it. Until then the code
// is just a uuid this device invented, and an empty history must not be trusted
// to overwrite anything.
const OK_KEY = 'liftlog.codeok';
let syncState = 'idle', syncErr = '', pushTimer = null;

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function syncCode() {
  let c = lsGet(CODE_KEY);
  if (!c) { c = crypto.randomUUID(); lsSet(CODE_KEY, c); }
  return c;
}
const codeEstablished = () => lsGet(OK_KEY) === '1';
const markEstablished = () => lsSet(OK_KEY, '1');

async function rpc(fn, body) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: SB_ANON, authorization: 'Bearer ' + SB_ANON },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.text()).slice(0, 160));
  return r.json();
}

// Debounced: a burst of set edits should be one upload, not twenty.
function queuePush() { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 2000); }

async function pushNow() {
  clearTimeout(pushTimer);
  if (!db) return;
  // A blank slate never overwrites a backup. A cleared browser store or a fresh
  // install has no history and no proof its code is the right one -- pushing then
  // would either strand an empty row under a brand new code or, if the code were
  // real, wipe the history it was meant to protect. Hold until there is either
  // something to save or a pull that proves the code.
  if (!db.sessions.length && !codeEstablished()) { syncState = 'hold'; return paintSync(); }
  if (!navigator.onLine) { syncState = 'offline'; return paintSync(); }
  syncState = 'syncing'; paintSync();
  try {
    await rpc('liftlog_push', { p_code: syncCode(), p_payload: db });
    markEstablished();
    db.lastSync = Date.now(); syncState = 'ok'; syncErr = '';
    // Written straight through rather than via save(), which would queue another push.
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  } catch (e) {
    syncState = 'error'; syncErr = String((e && e.message) || e);
  }
  paintSync();
}

// Whatever failed to go out while the signal was gone goes out when it returns.
addEventListener('online', () => { if (syncState !== 'ok') pushNow(); });

async function pullInto(code) {
  const payload = await rpc('liftlog_pull', { p_code: code });
  if (!payload) return false;
  db = payload;
  markEstablished();
  const d = DEFAULTS();
  for (const k in d) if (db[k] === undefined) db[k] = d[k];
  for (const k in d.settings) if (db.settings[k] === undefined) db.settings[k] = d.settings[k];
  save();
  return true;
}

function syncLabel() {
  if (syncState === 'syncing') return 'Backing up\u2026';
  if (syncState === 'error') return 'Backup failed, will retry. ' + syncErr;
  if (syncState === 'offline') return 'Offline. Will back up when you have signal.';
  if (syncState === 'hold') return 'Not backing up yet \u2014 no workouts on this phone. Log one, or restore from your sync code.';
  if (db && db.lastSync) return 'Backed up ' + new Date(db.lastSync).toLocaleString();
  return 'Not backed up yet.';
}
function paintSync() { const el = $('#syncLine'); if (el) el.textContent = syncLabel(); }

// ---------- exercise helpers ----------
const kindOf = n => db.kinds[key(n)] || 'bw';          // load = dumbbells etc, addon = bodyweight + optional weight, bw = bodyweight only
const KIND_LABEL = { load: 'Weights', addon: 'Bodyweight, can add weight', bw: 'Bodyweight only' };
const restOf = n => db.settings.restByEx[key(n)] ?? db.settings.rest;
const exRest = ex => ex.rest ?? restOf(ex.name);
const curTmpl = () => db.active && db.templates.find(x => x.id === db.active.tmplId);
// Ask whether a change is for today only or also saved to the template
function askScope(title, detail, todayLbl, futureLbl) {
  const t = curTmpl();
  if (!t) return Promise.resolve('today');
  return new Promise(res => {
    sheet(`<h3>${esc(title)}</h3>${detail ? `<div class="mut small" style="margin-bottom:10px">${esc(detail)}</div>` : ''}
      <button class="big" id="scT" style="margin-bottom:8px">${esc(todayLbl || 'Just today')}</button>
      <button class="big" id="scF">${esc(futureLbl || 'Today and every future ' + t.name + ' workout')}</button>
      <button class="big" id="scX" style="margin-top:8px;background:none">Cancel</button>`);
    $('#scT').onclick = () => { closeSheet(); res('today'); };
    $('#scF').onclick = () => { closeSheet(); res('future'); };
    $('#scX').onclick = () => { closeSheet(); res(null); };
  });
}
const isBwSession = sets => !sets.some(s => s.w > 0);

function lastFor(name, bw, skipId) {
  const k = key(name);
  for (let i = db.sessions.length - 1; i >= 0; i--) {
    const s = db.sessions[i];
    if (s.id === skipId) continue;
    for (const e of s.exercises) {
      if (key(e.name) !== k || !e.sets.length) continue;
      const kind = kindOf(name);
      if (kind === 'addon' && isBwSession(e.sets) !== !!bw) continue;
      return { date: s.end, sets: e.sets };
    }
  }
  return null;
}
function allNames() {
  const m = new Map();
  const add = n => { const c = canon(n); if (c && !m.has(c.toLowerCase())) m.set(c.toLowerCase(), c); };
  db.templates.forEach(t => t.ex.forEach(e => add(e.name)));
  db.sessions.forEach(s => s.exercises.forEach(e => add(e.name)));
  return [...m.values()].sort((a, b) => a.localeCompare(b));
}
function setsText(sets, bw, unit = '') {
  return sets.map(s => bw || !(s.w > 0) ? String(s.r) : `${s.w}×${s.r}`).join(', ');
}
function prefill(ex) {
  const last = lastFor(ex.name, ex.bw);
  ex.last = last ? last.sets.map(s => ({ w: s.w, r: s.r })) : null;
  ex.lastDate = last ? last.date : null;
  const done = ex.sets.filter(s => s.done);
  // If you added or removed sets today, keep your count; otherwise match last time
  const n = ex.setsEdited ? Math.max(done.length, ex.sets.length) : Math.max(done.length, last ? last.sets.length : 0, ex.tmplSets || 0, last ? 0 : (ex.sets.length || 2));
  const out = [];
  for (let i = 0; i < n; i++) {
    const cur = ex.sets[i];
    if (cur && cur.done) { out.push(cur); continue; }
    const l = last && last.sets[i] ? last.sets[i] : (last ? last.sets[last.sets.length - 1] : null);
    out.push({ w: ex.bw ? 0 : (l ? l.w : 0), r: l ? l.r : 0, done: false });
  }
  ex.sets = out;
}
function newEx(name, bwFlag, tmplSets) {
  name = canon(name);
  const kind = kindOf(name);
  const ex = { name, sets: [], tmplSets, bw: kind === 'bw' ? true : kind === 'load' ? false : !!bwFlag };
  if (db.settings.travel) applyTravel(ex, true, true);
  prefill(ex);
  return ex;
}
function applyTravel(ex, on, noPrefill) {
  if (ex.sets.some(s => s.done)) return;
  const kind = kindOf(ex.name);
  if (on) {

function codeSheet() {

function canonFromKey(k) { return allNames().find(n => n.toLowerCase() === k) || k; }

// ---------- timer ----------
let ac, firedFor = null, armedFor = null, armDue = 0, armed = [], tries = 0;
function primeAudio() {
  try {
    // 'transient' is the session type for a short alert: it plays on top of
    // whatever you are listening to, ducking it, instead of pausing it the way
    // 'playback' would. The default, 'ambient', just mixes in underneath.
    if (navigator.audioSession) navigator.audioSession.type = 'transient';
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
  return ac;
}
// Two triplets, a square wave near full gain: this has to carry across a gym
// and over music. Placed on the audio clock, possibly minutes out — scheduling
// ahead is the point, since setInterval gets throttled to a crawl once the app
// is not frontmost and an alarm fired from the tick arrives late or never.
const NOTES = [[0, 1047], [.2, 1047], [.4, 1047], [.68, 1319], [.88, 1319], [1.08, 1319]];
function beepAt(ctx, t0, onDone) {
  for (const [d, hz] of NOTES) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = hz;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(.8, t0 + d + .01);
    g.gain.setValueAtTime(.8, t0 + d + .13);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .17);
    o.start(t0 + d); o.stop(t0 + d + .18);
    if (onDone && d === NOTES[NOTES.length - 1][0]) o.onended = onDone;
    armed.push(o);
  }
}
function disarm() { armed.forEach(o => { try { o.onended = null; o.stop(); } catch (e) {} }); armed = []; armedFor = null; }
// Placing the notes two minutes out on the audio clock did not survive on
// iOS: WebKit suspends a context that has gone quiet and the queue goes with
// it. So they are placed only in the last couple of seconds, with the context
// resumed right before — a short window with nothing to lose.
const LEAD = 2;
// And armed is not rang. The oscillator's own onended is the only honest
// evidence it sounded. Taking arming as proof was the other half of the bug:
// a rest whose alarm got swallowed was marked rung by a beep nobody heard, so
// the retry below never ran and coming back to the app was silent too.
function alarmTick() {
  const t = db.timer;
  if (!t) { if (armed.length) disarm(); return; }
  if (firedFor === t.end) return;
  const left = (t.end - Date.now()) / 1000;
  if (armedFor === t.end) {
    // Each attempt gets its own deadline. Measuring from the end of the rest
    // instead would call a burst overdue before it had finished playing, and
    // then make every retry instantly overdue on top of that.
    if (Date.now() > armDue) { disarm(); if (++tries >= 3) firedFor = t.end; }
    return;
  }
  if (left > LEAD) return;
  const ctx = primeAudio();
  if (!ctx) { firedFor = t.end; return; } // no Web Audio at all: stop trying
  const place = () => {
    if (!db.timer || db.timer.end !== t.end || ctx.state !== 'running') return; // next tick tries again
    const inS = Math.max(0, (t.end - Date.now()) / 1000);
    armedFor = t.end;
    // The last note starts 1.08s after the first and runs 0.18s; allow for all
    // of that plus slack before concluding nothing came out.
    armDue = Date.now() + inS * 1000 + 2500;
    try { beepAt(ctx, ctx.currentTime + inS, () => { firedFor = t.end; }); } catch (e) { armedFor = null; }
    try { if (navigator.vibrate) setTimeout(() => navigator.vibrate([180, 90, 180, 90, 180]), inS * 1000); } catch (e) {}
  };
  if (ctx.state === 'running') place();
  else if (ctx.resume) ctx.resume().then(place, () => {});
}

// Ticking a set is starting the workout, whether or not Start got tapped.
function beginWorkout() { if (db.active && !db.active.start) { db.active.start = Date.now(); save(); wake(); } }
function startRest(sec, label) { db.timer = { end: Date.now() + sec * 1000, total: sec, label }; firedFor = null; tries = 0; disarm(); tShell = false; save(); tick(); }
// The bar is built once per rest and then only its numbers move: rewriting it
// every 250ms would steal the press off a button mid-tap.
let tShell = false;
function buildTimerBar() {
  const el = $('#timer');
  el.innerHTML = `<div class="bar"></div><div class="in"><div class="t"><span class="tv"></span><span class="lbl"></span></div>
    <button class="tadj" data-act="tDelta" data-d="-15">−15<br>sec</button>
    <button class="tadj" data-act="tDelta" data-d="15">+15<br>sec</button>
    <button class="pri" data-act="tStop"></button></div>`;
  tShell = true;
}
function tick() {
  document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = !db.active ? '' : db.active.start ? fmtT((Date.now() - db.active.start) / 1000) : 'Not started'; });
  const el = $('#timer'), t = db.timer;
  if (!t) { el.hidden = true; if (tShell) { el.innerHTML = ''; tShell = false; } return; }
  el.hidden = false;
  if (!tShell || !el.firstChild) buildTimerBar();
  const left = (t.end - Date.now()) / 1000, over = left <= 0;
  alarmTick();
  el.classList.toggle('over', over);
  el.querySelector('.bar').style.width = (over ? 100 : 100 * (1 - left / t.total)) + '%';
  el.querySelector('.tv').textContent = over ? 'Go' : fmtT(left);
  el.querySelector('.lbl').textContent = over ? 'Rest done · ' + fmtT(-left) + ' ago' : 'Rest · ' + (t.label || '');
  el.querySelector('.pri').textContent = over ? 'OK' : 'Skip';
}
function tAdjust(d) {
  const t = db.timer; if (!t) return;
  const now = Date.now();
  if (t.end < now) t.end = now;
  t.end += d * 1000; t.total = Math.max(1, t.total + d);
  if (t.end <= now) t.end = now;
  firedFor = null; tries = 0; disarm(); save(); tick();
}
setInterval(tick, 250);

// wake lock keeps the screen on during a workout
let wl = null;
async function wake() { try { if (db.active && db.active.start && 'wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); tick(); } });

// Behave like an app, not a page: no pinch zoom, no double-tap zoom.
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

// ---------- rest picker ----------
// A snap wheel instead of +/- buttons: repeated taps on a stepper were landing
// as double-taps and zooming the page.
const PITEM = 44;
const REST_OPTS = Array.from({ length: 40 }, (_, i) => (i + 1) * 15);
const nearestRest = s => REST_OPTS.reduce((a, b) => Math.abs(b - s) < Math.abs(a - s) ? b : a);
function pickerHTML(id, sel) {
  const v = nearestRest(sel);
  return `<div class="pwrap"><div class="picker" id="${id}" data-v="${v}"><div class="plist">` +
    REST_OPTS.map(s => `<div class="pitem${s === v ? ' sel' : ''}">${fmtT(s)}</div>`).join('') +
    `</div></div><div class="pband"></div></div>`;
}
function mountPicker(id, onPick) {
  const el = $('#' + id); if (!el) return;
  const items = [...el.querySelectorAll('.pitem')];
  let idx = REST_OPTS.indexOf(+el.dataset.v), settle = null;
  el.scrollTop = idx * PITEM;
  el.addEventListener('scroll', () => {
    const i = Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / PITEM)));
    if (i !== idx) {
      items[idx].classList.remove('sel'); items[i].classList.add('sel');
      idx = i; el.dataset.v = REST_OPTS[i];
      if (navigator.vibrate) navigator.vibrate(5);
    }
    if (onPick) { clearTimeout(settle); settle = setTimeout(() => onPick(REST_OPTS[idx]), 160); }
  }, { passive: true });
}
const pickerVal = id => +$('#' + id).dataset.v;

// ---------- sheet + toast ----------
function sheet(html) { const s = $('#sheet'); s.innerHTML = `<div class="pane">${html}</div>`; s.hidden = false; }
function ask(msg, ok = 'OK', danger) {
  return new Promise(res => {
    sheet(`<h3>${esc(msg)}</h3><button class="big ${danger ? '' : 'pri'}" id="askOk" style="${danger ? 'background:var(--bad);color:#fff;font-weight:600' : ''}">${esc(ok)}</button><button class="big" id="askNo" style="margin-top:8px;background:none">Cancel</button>`);
    $('#askOk').onclick = () => { closeSheet(); res(true); };
    $('#askNo').onclick = () => { closeSheet(); res(false); };
  });
}
function askText(title, val) {
  return new Promise(res => {
    sheet(`<h3>${esc(title)}</h3><input id="askIn" value="${esc(val)}"><button class="big pri" id="askOk" style="margin-top:10px">Save</button><button class="big" id="askNo" style="margin-top:8px;background:none">Cancel</button>`);
    $('#askOk').onclick = () => { const v = $('#askIn').value; closeSheet(); res(v); };
    $('#askNo').onclick = () => { closeSheet(); res(null); };

}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

function pickExerciseSheet(title, onPick, preferBw) {
  const names = allNames();
  const order = n => { const k = kindOf(n); return preferBw ? (k === 'load' ? 1 : 0) : 0; };
  names.sort((a, b) => order(a) - order(b) || a.localeCompare(b));
  sheet(`<h3>${esc(title)}</h3><div class="row"><input id="newName" placeholder="New exercise name"></div>
    <div class="row" style="margin:8px 0 4px"><button data-k="load" class="nk">Weights</button><button data-k="addon" class="nk">Bodyweight +wt</button><button data-k="bw" class="nk">Bodyweight</button></div>
    <div class="mut small">Type a name, then tap what kind it is. Or pick one below.</div>
    <div class="list">${names.map(n => `<button class="pk" data-n="${esc(n)}">${esc(n)}<span class="k">${KIND_LABEL[kindOf(n)]}</span></button>`).join('')}</div>`);
  const pane = $('#sheet .pane');
  pane.querySelectorAll('.pk').forEach(b => b.onclick = () => { closeSheet(); onPick(b.dataset.n); });
  pane.querySelectorAll('.nk').forEach(b => b.onclick = () => {
    const n = canon($('#newName').value); if (!n) { $('#newName').focus(); return; }
    if (!db.kinds[key(n)] || kindOf(n) !== b.dataset.k) db.kinds[key(n)] = b.dataset.k;
    closeSheet(); onPick(n);
  });
}

// The name and date inputs are rebuilt on every render (a stepper tap renders),
// so they are read into the copy before anything that could discard them.
function readEditFields() {
  if (!editing) return;
  const n = $('#eName'), d = $('#eDate');
  if (n && n.value.trim()) editing.name = n.value.trim();
  if (d && d.value) {
    const [y, mo, da] = d.value.split('-').map(Number), dur = editing.end - editing.start;
    const e = new Date(editing.end); e.setFullYear(y, mo - 1, da);
    editing.end = e.getTime(); editing.start = editing.end - dur;
  }
}
// ---------- actions ----------
const act = {
  nav(b) { view = b.dataset.v; openSess = null; editing = null; render(); window.scrollTo(0, 0); },
  dismissImport() { db.imported = true; save(); render(); },
  travel() {
    db.settings.travel = !db.settings.travel;
    if (db.active) db.active.exercises.forEach(ex => applyTravel(ex, db.settings.travel));
    save(); render();
  },
  async start(b) {
    if (db.active && !(await ask('A workout is already in progress. Discard it and start this one?', 'Discard and start', true))) return;
    const t = db.templates.find(x => x.id === b.dataset.id);
    // start stays null until Start is tapped (or the first set is ticked), so opening
    // a workout to edit it does not put a running clock on a session you never did.
    db.active = { id: uid(), name: t.name, tmplId: t.id, start: null, opened: Date.now(), exercises: t.ex.map(e => { const x = newEx(e.name, e.bw, e.sets); x.tmplBw = e.bw; return x; }) };
    db.timer = null; save(); view = 'workout'; render(); window.scrollTo(0, 0);
  },
  async startEmpty() {
    if (db.active && !(await ask('A workout is already in progress. Discard it and start a new one?', 'Discard and start', true))) return;
    db.active = { id: uid(), name: 'Workout', start: null, opened: Date.now(), exercises: [] };
    db.timer = null; save(); view = 'workout'; render();
  },
  begin() { beginWorkout(); render(); window.scrollTo(0, 0); },
  toggleBw(b) { const ex = db.active.exercises[b.dataset.i]; ex.bw = !ex.bw; prefill(ex); save(); render(); },
  rest(b) {
    const ex = db.active.exercises[b.dataset.i];
    sheet(`<h3>Rest for ${esc(ex.name)}</h3><div class="mut small">${ex.rest != null ? `Set to ${fmtT(ex.rest)} for today only. Usually ${fmtT(restOf(ex.name))}.` : `Usually ${fmtT(restOf(ex.name))}`}</div>
      ${pickerHTML('rsP', exRest(ex))}
      <button class="big pri" id="rsF">Save</button>
      <div class="mut small" style="text-align:center;margin:6px 0 2px">Applies to this and all future workouts.</div>
      <div class="row" style="margin-top:8px"><button id="rsT" style="background:none;color:var(--acc)">Today only</button><button id="rsX" style="background:none">Cancel</button></div>
      ${ex.rest != null ? `<button class="big" id="rsU" style="margin-top:8px">Back to usual (${fmtT(restOf(ex.name))})</button>` : ''}`);
    if ($('#rsU')) $('#rsU').onclick = () => { delete ex.rest; closeSheet(); save(); render(); toast(`${ex.name}: back to ${fmtT(restOf(ex.name))}`); };
    mountPicker('rsP');
    $('#rsT').onclick = () => { const v = pickerVal('rsP'); ex.rest = v; closeSheet(); save(); render(); toast(`${ex.name}: ${fmtT(v)} rest today`); };
    $('#rsF').onclick = () => { const v = pickerVal('rsP'); db.settings.restByEx[key(ex.name)] = v; delete ex.rest; closeSheet(); save(); render(); toast(`${ex.name}: ${fmtT(v)} rest from now on`); };
    $('#rsX').onclick = closeSheet;
  },
  step(b) {
    const s = db.active.exercises[b.dataset.i].sets[b.dataset.s], f = b.dataset.f;
    s[f] = Math.max(0, Math.round((num(s[f]) + +b.dataset.d) * 10) / 10); save(); render();
  },
  done(b) {
    const ex = db.active.exercises[b.dataset.i], s = ex.sets[b.dataset.s];
    s.done = !s.done;
    if (s.done) { beginWorkout(); startRest(exRest(ex), ex.name); }
    save(); render();
  },
  addSet(b) { const ex = db.active.exercises[b.dataset.i]; const p = ex.sets[ex.sets.length - 1]; ex.sets.push({ w: p ? p.w : 0, r: p ? p.r : 0, done: false }); ex.setsEdited = true; save(); render(); },
  delSet(b) { const ex = db.active.exercises[b.dataset.i]; const k = ex.sets.map(s => !s.done).lastIndexOf(true); if (k >= 0) ex.sets.splice(k, 1); ex.setsEdited = true; save(); render(); },
  tStop() { disarm(); db.timer = null; save(); tick(); },
  tDelta(b) { tAdjust(+b.dataset.d); },
  testBeep() { const ctx = primeAudio(); if (ctx) try { beepAt(ctx, ctx.currentTime + .05); } catch (e) {} toast('Heard nothing? Check the ringer switch.'); },
  exMenu(b) {
    const i = +b.dataset.i;
    sheet(`<h3>${esc(db.active.exercises[i].name)}</h3><div class="list">
      <button data-act="swap" data-i="${i}">Swap for another exercise…</button>
      <button data-act="move" data-i="${i}" data-d="-1">Move up…</button>
      <button data-act="move" data-i="${i}" data-d="1">Move down…</button>
      <button data-act="exKind" data-i="${i}">Change type (${KIND_LABEL[kindOf(db.active.exercises[i].name)]})</button>
      <button class="danger" data-act="delEx" data-i="${i}">Remove…</button></div>`);
  },
  exKind(b) {
    const ex = db.active.exercises[b.dataset.i];
    sheet(`<h3>${esc(ex.name)} is…</h3><div class="list">${Object.entries(KIND_LABEL).map(([k, v]) => `<button data-act="setKind" data-i="${b.dataset.i}" data-k="${k}">${v}</button>`).join('')}</div>`);
  },
  setKind(b) {
    const ex = db.active.exercises[b.dataset.i]; db.kinds[key(ex.name)] = b.dataset.k;
    ex.bw = b.dataset.k === 'bw' ? true : b.dataset.k === 'load' ? false : ex.bw;
    prefill(ex); closeSheet(); save(); render();
  },
  async move(b) {
    const i = +b.dataset.i, j = i + +b.dataset.d, a = db.active.exercises; if (j < 0 || j >= a.length) return closeSheet();
    const sc = await askScope(`Move ${a[i].name} ${+b.dataset.d < 0 ? 'up' : 'down'}`, '', 'Just today', `Today and in the ${curTmpl() && curTmpl().name} template`); if (!sc) return;
    [a[i], a[j]] = [a[j], a[i]];

    save(); render();
  },
  async delEx(b) {
    const i = +b.dataset.i, ex = db.active.exercises[i], t = curTmpl();

    const sc = inT ? await askScope(`Remove ${ex.name}`, '', 'Skip it just today', `Remove from the ${t.name} template too`) : (closeSheet(), 'today');

    save(); render();
  },
  swap(b) {
    const i = +b.dataset.i, ex = db.active.exercises[i];
    pickExerciseSheet(`Swap ${ex.name} for…`, async n => {
      const from = ex.orig || ex.name, t = curTmpl();
      if (db.settings.travel && kindOf(from) === 'load' && kindOf(n) !== 'load') { db.settings.subs[key(from)] = canon(n); toast('Swap saved for travel days'); }
      else if (t && t.ex.some(e => key(e.name) === key(from))) {
        const sc = await askScope(`Swap ${from} for ${canon(n)}`, '', 'Just today', `Today and in the ${t.name} template`);
        if (!sc) return;
        if (sc === 'future') { t.ex.forEach(e => { if (key(e.name) === key(from)) { e.name = canon(n); e.bw = false; } }); ex.orig = null; ex.name = canon(n); delete ex.orig; const k = kindOf(ex.name); ex.bw = k === 'bw'; ex.sets = ex.sets.some(s => s.done) ? ex.sets : []; prefill(ex); save(); render(); return; }
      }
      ex.orig = from; ex.name = canon(n);

      const k = kindOf(ex.name); ex.bw = k === 'bw' ? true : k === 'load' ? false : (db.settings.travel || ex.bw);
      ex.sets = ex.sets.filter(s => s.done).length ? ex.sets : [];

    }, db.settings.travel);
  },
  addEx() {
    pickExerciseSheet('Add exercise', async n => {
      const sc = await askScope(`Add ${canon(n)}`, '', 'Just today', `Today and every future ${curTmpl() && curTmpl().name} workout`); if (!sc) return;
      db.active.exercises.push(newEx(n, db.settings.travel, 2));

  exHist(b) {

    }

  },
  async finish() {

    sheet(`<h3>Finish workout?</h3><div class="mut" style="margin-bottom:12px">${doneCount} sets logged.</div>
      ${!t ? `<input id="saveAs" placeholder="Save as a new template (optional name)" style="margin-bottom:12px">` : ''}
      <button class="pri big" data-act="doFinish">Save</button><button class="big" style="margin-top:8px;background:none" onclick="closeSheet()">Keep going</button>`);
  },
  doFinish() {
    const a = db.active, t = db.templates.find(x => x.id === a.tmplId);
    const saveAs = $('#saveAs') && $('#saveAs').value.trim();
    let up = 0, eq = 0;
    const exercises = a.exercises.map(e => {
      const sets = e.sets.filter(s => s.done).map(s => ({ w: e.bw ? 0 : num(s.w), r: num(s.r) }));
      sets.forEach((s, j) => { const c = cmp(s, e.last && e.last[j], e.bw); if (c === 'up') up++; if (c === 'eq') eq++; });
      return { name: e.name, sets, bw: e.bw, orig: e.orig };
    }).filter(e => e.sets.length);
    const sess = { id: a.id, name: saveAs || a.name, start: a.start || a.opened || Date.now(), end: Date.now(), exercises: exercises.map(({ name, sets }) => ({ name, sets })) };
    if (saveAs) db.templates.push({ id: uid(), name: saveAs, ex: exercises.map(e => ({ name: e.name, sets: e.sets.length, bw: e.bw })) });
    db.sessions.push(sess); db.active = null; db.timer = null; save(); closeSheet();
    try { wl && wl.release(); } catch (e) {}
    view = 'home'; render(); window.scrollTo(0, 0);
    toast(`Saved. Beat ${up} set${up === 1 ? '' : 's'}, matched ${eq}.`);
    // The code is worth nothing written on the phone it lives on. Ask after every
    // workout until it has actually been written down somewhere else.
    if (!db.codeAck) setTimeout(codeSheet, 900);
  },
  async discard(b, sure) {
    if (!sure && !(await ask('Discard this workout? Nothing will be saved.', 'Discard', true))) return;
    db.active = null; db.timer = null; save(); view = 'home'; render();
  },
  hTab(b) { hs.tab = b.dataset.v; hs.pt = null; openSess = null; editing = null; render(); },
  calNav(b) { let [y, m] = hs.ym; m += +b.dataset.d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } hs.ym = [y, m]; hs.day = null; render(); },
  calDay(b) { hs.day = hs.day === b.dataset.k ? null : b.dataset.k; render(); },
  pBw(b) { hs.bw = b.dataset.v === '1'; hs.pt = null; render(); },
  pMetric(b) { hs.metric = b.dataset.v; hs.pt = null; render(); },
  pPt(b) { hs.pt = +b.dataset.k; render(); },
  openSess(b, e) { if (e.target.closest('[data-act="delSess"]')) return; openSess = openSess === b.dataset.id ? null : b.dataset.id; render(); },
  async delSess(b) { if (!(await ask('Delete this workout from history?', 'Delete', true))) return; db.sessions = db.sessions.filter(s => s.id !== b.dataset.id); save(); render(); },
  editSess(b) { startEdit(b.dataset.id); },
  eStep(b) {
    const x = editing.exercises[b.dataset.i].sets[b.dataset.s], f = b.dataset.f;
    x[f] = Math.max(0, Math.round((num(x[f]) + +b.dataset.d) * 10) / 10); render();
  },
  eAddSet(b) { const ex = editing.exercises[b.dataset.i], p = ex.sets[ex.sets.length - 1]; ex.sets.push({ w: p ? p.w : 0, r: p ? p.r : 0 }); render(); },
  // An exercise with no sets left is not an exercise you did.
  eDelSet(b) { const ex = editing.exercises[b.dataset.i]; ex.sets.splice(+b.dataset.s, 1); if (!ex.sets.length) editing.exercises.splice(+b.dataset.i, 1); render(); },
  eExMenu(b) {
    const i = +b.dataset.i;
    sheet(`<h3>${esc(editing.exercises[i].name)}</h3><div class="list">
      <button data-act="eSwapEx" data-i="${i}">Change which exercise this was\u2026</button>
      <button data-act="eMove" data-i="${i}" data-d="-1">Move up</button>
      <button data-act="eMove" data-i="${i}" data-d="1">Move down</button>
      <button class="danger" data-act="eDelEx" data-i="${i}">Remove from this workout</button></div>`);
  },
  eSwapEx(b) {
    const ex = editing.exercises[+b.dataset.i];
    pickExerciseSheet(`This was\u2026`, n => { ex.name = canon(n); render(); });
  },
  eMove(b) {
    const i = +b.dataset.i, j = i + +b.dataset.d, a = editing.exercises;
    if (j < 0 || j >= a.length) return closeSheet();
    [a[i], a[j]] = [a[j], a[i]]; closeSheet(); render();
  },
  eDelEx(b) { editing.exercises.splice(+b.dataset.i, 1); closeSheet(); render(); },
  eAddEx() { pickExerciseSheet('Add exercise', n => { editing.exercises.push({ name: canon(n), sets: [{ w: 0, r: 0 }] }); render(); window.scrollTo(0, document.body.scrollHeight); }); },
  eSave() {
    readEditFields();
    const s = editing;
    s.exercises = s.exercises.map(e => ({ name: e.name, sets: e.sets.map(x => ({ w: num(x.w), r: num(x.r) })) })).filter(e => e.sets.length);
    if (!s.exercises.length) return toast('Nothing left in it \u2014 delete the workout instead');
    const i = db.sessions.findIndex(x => x.id === s.id);
    if (i < 0) { editing = null; view = 'history'; render(); return toast('That workout is no longer here'); }
    db.sessions[i] = s;
    // Everything that reads history walks it oldest-first, so a changed date
    // has to actually move the workout, not just relabel it.
    db.sessions.sort((a, b) => a.end - b.end);
    // Land back on the workout, even if the date change moved which day it is on.
    hs.day = dayKey(s.end); hs.ym = [new Date(s.end).getFullYear(), new Date(s.end).getMonth()];
    editing = null; save(); view = 'history'; openSess = s.id; render(); toast('Saved');
  },
  async eCancel() {
    readEditFields();
    if (JSON.stringify(editing) !== editWas && !(await ask('Throw away these changes?', 'Discard', true))) return;
    editing = null; view = 'history'; render();
  },
  tmplMenu(b) {
    const t = db.templates.find(x => x.id === b.dataset.id);
    sheet(`<h3>${esc(t.name)}</h3><div class="mut small" style="margin-bottom:8px">${t.ex.map(e => esc(e.name)).join(', ')}</div><div class="list">
      <button data-act="tmplRename" data-id="${t.id}">Rename</button>
      <button data-act="tmplUp" data-id="${t.id}">Move up</button>
      <button class="danger" data-act="tmplDel" data-id="${t.id}">Delete template</button></div>
      <div class="mut small">To change its exercises, start it and add, remove or swap. Each change asks if it's just for today or for every future ${esc(t.name)} workout.</div>`);
  },
  async tmplRename(b) { const t = db.templates.find(x => x.id === b.dataset.id); const n = await askText('Template name', t.name); if (n && n.trim()) { t.name = n.trim(); save(); } render(); },
  tmplUp(b) { const i = db.templates.findIndex(x => x.id === b.dataset.id); if (i > 0) { const a = db.templates; [a[i - 1], a[i]] = [a[i], a[i - 1]]; save(); } closeSheet(); render(); },
  async tmplDel(b) { if (!(await ask('Delete this template? Your history stays.', 'Delete', true))) return; db.templates = db.templates.filter(x => x.id !== b.dataset.id); save(); closeSheet(); render(); },
  delSub(b) { delete db.settings.subs[b.dataset.k]; save(); render(); },
  import() { $('#file').value = ''; $('#file').click(); },
  export() { exportCSV(); },
  syncNow() { pushNow(); },
  showCode() { codeSheet(); },
  ackCode() { db.codeAck = true; save(); closeSheet(); toast('Keep it somewhere that is not this phone.'); },
  async restore() {
    const c = (await askText('Paste the sync code from your other phone', '') || '').trim();
    if (!c) return;
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c)) return toast('That is not a sync code');
    if (!await ask('Replace everything on this phone with the backup for that code?', 'Restore', true)) return;
    try {
      if (!await pullInto(c)) return toast('No backup found for that code');
      try { localStorage.setItem(CODE_KEY, c); } catch (e) {}
      view = 'home'; render(); toast('Restored');
    } catch (e) { toast('Restore failed'); }
  },
  async wipe() { if (await ask('Erase all workouts, templates and settings on this phone? Export first if you want a backup.', 'Erase everything', true)) { db = DEFAULTS(); save(); view = 'home'; render(); } },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  primeAudio();
  const f = act[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener('change', e => { if (e.target.id === 'progEx') { hs.ex = e.target.value; hs.pt = null; const k = kindOf(hs.ex); hs.bw = k === 'bw'; render(); } });
document.addEventListener('focusin', e => { if (e.target.matches('.stp input')) setTimeout(() => e.target.select(), 0); });
// A set row looks the same whether it is today's workout or a finished one
// being corrected; data-edit says which object the number belongs to.
const setFor = el => {
  const host = el.dataset.edit ? editing : db.active;
  const ex = host && host.exercises[el.dataset.i];
  return ex && ex.sets[el.dataset.s];
};
document.addEventListener('change', e => {
  const el = e.target; if (!el.matches('.stp input')) return;
  const s = setFor(el); if (!s) return;
  s[el.dataset.f] = Math.max(0, num(el.value));
  if (!el.dataset.edit) save();
  render();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.matches('.stp input')) return;
  const s = setFor(el); if (!s) return;
  s[el.dataset.f] = Math.max(0, num(el.value));
  if (!el.dataset.edit) save();
});

// ---------- CSV import / export ----------
function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}
// Decide each exercise's type by majority, so a stray prefilled weight doesn't turn a TRX move into a "weights" lift
let tally = {};
function learnKind(name, wt, w) {
  const k = key(name), t = tally[k] || (tally[k] = { load: 0, addon: 0, bw: 0 });
  if (wt === 'Weight' && w > 0) t.load++; else if (wt === 'Weighted Bodyweight') t.addon++; else t.bw++;
}
function applyKinds() {
  for (const [k, t] of Object.entries(tally)) {
    if (t.load > t.addon + t.bw) db.kinds[k] = 'load';
    else if (t.addon > 0 && db.kinds[k] !== 'load') db.kinds[k] = 'addon';
    else if (!db.kinds[k]) db.kinds[k] = t.load > t.addon + t.bw ? 'load' : 'bw';
  }
  tally = {};
}
$('#file').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const rows = parseCSV(await file.text()), hd = rows.shift().map(h => h.trim());
    const ix = n => hd.indexOf(n);
    if (ix('Exercise Name') < 0 || ix('Workout Name') < 0) throw new Error('Not an Easy Reps export');
    if (ix('Completed Date') >= 0) importHistory(rows, ix); else importTemplates(rows, ix);
    applyKinds();
    db.imported = true; save(); render();
  } catch (err) { toast('Could not import that file: ' + err.message); }
});
function importHistory(rows, ix) {
  const map = new Map(), have = new Set(db.sessions.map(s => s.id));
  for (const r of rows) {
    const date = r[ix('Completed Date')], wname = r[ix('Workout Name')], id = 'er-' + date;
    if (!date || have.has(id)) continue;
    const w = num(r[ix('Weight')]), reps = num(r[ix('Value')]), name = canon(r[ix('Exercise Name')]);
    if (!name || /^exercise \d+$/i.test(name)) continue;
    learnKind(name, r[ix('Weight Type')], w);
    if (!map.has(id)) { const end = Date.parse(date); map.set(id, { id, name: wname, start: end - num(r[ix('Duration')]) * 1000, end, exercises: [] }); }
    const s = map.get(id);
    let ex = s.exercises.find(x => key(x.name) === key(name));
    if (!ex) { ex = { name, sets: [] }; s.exercises.push(ex); }
    ex.sets[num(r[ix('Set Order')])] = { w, r: reps, c: String(r[ix('Completed')]).toLowerCase() === 'true' };
  }
  let n = 0;
  for (const s of map.values()) { // Keep unticked sets only when the exercise was actually done that day (you sometimes skip ticking the last set)
    s.exercises.forEach(e => { e.sets = e.sets.filter(Boolean); e.sets = e.sets.some(x => x.c) ? e.sets.filter(x => x.r > 0).map(({ w, r }) => ({ w, r })) : []; }); s.exercises = s.exercises.filter(e => e.sets.length); if (s.exercises.length) { db.sessions.push(s); n++; } }
  db.sessions.sort((a, b) => a.end - b.end);
  toast(`Imported ${n} workouts`);
}
function importTemplates(rows, ix) {
  const map = new Map();
  for (const r of rows) {
    const t = r[ix('Workout Name')], name = canon(r[ix('Exercise Name')]), w = num(r[ix('Weight')]);
    learnKind(name, r[ix('Weight Type')], w);
    if (!map.has(t)) map.set(t, []);
    const list = map.get(t); let ex = list.find(x => key(x.name) === key(name));
    if (!ex) { ex = { name, sets: 0, w: 0 }; list.push(ex); }
    ex.sets++; ex.w = Math.max(ex.w, w);
  }
  for (const [name, list] of map) {
    const ex = list.map(e => ({ name: e.name, sets: e.sets, bw: kindOf(e.name) === 'addon' && e.w === 0 }));
    const old = db.templates.find(t => t.name === name);
    if (old) old.ex = ex; else db.templates.push({ id: uid(), name, ex });
  }
  toast(`Imported ${map.size} templates`);
}
async function exportCSV() {
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const WT = { load: 'Weight', addon: 'Weighted Bodyweight', bw: 'Bodyweight' };
  const lines = ['Workout Name,Completed Date,Duration,Exercise Name,Mode,Weight Type,Distance Unit,Set Order,Weight,Value,Distance,Completed,Completed Date,Comment'];
  for (const s of db.sessions) {
    const d = new Date(s.end).toISOString().replace(/\.\d+Z$/, 'Z');
    for (const e of s.exercises) e.sets.forEach((x, j) => lines.push([q(s.name), d, (s.end - s.start) / 1000, q(e.name), 'Reps', WT[kindOf(e.name)], '', j, x.w.toFixed(1), x.r.toFixed(1), '0.0', 'True', d, ''].join(',')));
  }
  const name = `LiftLog_History_${new Date().toISOString().slice(0, 10)}.csv`;
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  try {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

// ---------- boot ----------
load();
// Backfill for installs that predate OK_KEY: history on the device plus a code in
// the device store is the pairing the flag is meant to record.
if (db.sessions.length) markEstablished();
if (window.SEED_CSV && !db.sessions.length && !db.imported) { const rows = parseCSV(window.SEED_CSV), hd = rows.shift().map(h => h.trim()); importHistory(rows, n => hd.indexOf(n)); applyKinds(); db.imported = true; save(); }
if (db.active) { view = 'workout'; wake(); }
render();
queuePush();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
